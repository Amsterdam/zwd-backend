[project]
name = "zwd-backend"
version = "0.1.0"
description = "Zaken Woningkwaliteit Duurzaamheid (ZWD) backend"
authors = [{ name = "Gemeente Amsterdam", email = "datapunt@amsterdam.nl" }]
readme = "../README.md"
requires-python = "~=3.13"
packages = [{ include = "apps" }]

dependencies = [
    "azure-identity~=1.23",
    "azure-monitor-opentelemetry~=1.6",
    "azure-storage-blob~=12.24",
    "celery~=5.5",
    "Django~=5.2",
    "django_celery_results~=2.5",
    "django-celery-beat~=2.7",
    "django-cors-headers~=4.7",
    "django-filter~=25.0",
    "django-spaghetti-and-meatballs~=0.4",
    "django-storages~=1.14",
    "djangorestframework~=3.15",
    "djangorestframework-simplejwt~=5.5",
    "drf-spectacular~=0.27",
    "mozilla-django-oidc~=4.0",
    "psycopg2-binary~=2.9",
    "python-magic~=0.4",
    "redis~=6.3",
    "spiffworkflow~=3.1",
    "watchdog~=6.0",
    "openpyxl>=3.1.5,<4.0.0",
    "packaging (>=26.2,<27.0)",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.4,<3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "debugpy~=1.8",
    "flake8~=7.0",
    "model-bakery~=1.18",
    "pre-commit (>=3.3.3,<4.0.0)",
]
